<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#0B0D12"/>
  <!-- run heatmap: three columns of cells, the middle one failing -->
  <g>
    <rect x="112" y="300" width="52" height="52" rx="12" fill="#10B981"/>
    <rect x="112" y="234" width="52" height="52" rx="12" fill="#10B981" opacity=".55"/>
    <rect x="230" y="300" width="52" height="52" rx="12" fill="#EF4444"/>
    <rect x="230" y="234" width="52" height="52" rx="12" fill="#10B981" opacity=".35"/>
    <rect x="348" y="300" width="52" height="52" rx="12" fill="#10B981"/>
    <rect x="348" y="234" width="52" height="52" rx="12" fill="#10B981" opacity=".55"/>
  </g>
